name: font-ci

on:
  push:
    branches: [main, "agent/**"]
  pull_request:

jobs:
  build-and-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test invariants
        run: pytest -q
      - name: Build and audit font
        run: syf-audit
      - name: Preserve diagnostic TTF
        uses: actions/upload-artifact@v4
        with:
          name: SaygiylaSunarMono-diagnostic
          path: build/SaygiylaSunarMono-Regular.ttf
